<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>자존주니</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f2;
      --card: #ffffff;
      --primary: #6b7c5e;
      --primary-light: #eef1ea;
      --accent: #c9a96e;
      --accent-light: #fdf6ec;
      --text: #2d2d2d;
      --muted: #888;
      --border: #e8e4de;
      --danger: #c0392b;
      --success: #4a7c59;
      --radius: 16px;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; }
    body {
      background: #e8e4de;
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    /* 모바일 앱처럼 중앙 고정 */
    #app-wrapper {
      width: 100%;
      max-width: 430px;
      background: var(--bg);
      min-height: 100vh;
      position: relative;
      padding-bottom: 80px;
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
    }
    /* 상단 헤더 */
    .app-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-header h1 { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin: 0; }
    .app-header .week-chip {
      font-size: 0.72rem; font-weight: 600;
      background: var(--primary-light); color: var(--primary);
      padding: 3px 10px; border-radius: 20px;
    }
    /* 하단 탭바 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-top: 2px solid var(--border);
      display: flex;
      z-index: 200;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
    }
    .bottom-nav button {
      flex: 1; border: none; background: none;
      padding: 10px 0 8px;
      font-size: 0.68rem; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      transition: color 0.2s; font-weight: 500;
    }
    .bottom-nav button i { font-size: 1.4rem; }
    .bottom-nav button.active {
      color: var(--primary); font-weight: 700;
      background: var(--primary-light);
    }
    /* 카드 */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 18px; margin-bottom: 14px;
    }
    .card-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
    /* 오늘의 질문 */
    .question-card {
      background: var(--primary); color: #fff;
      border-radius: var(--radius); padding: 20px; margin-bottom: 14px;
    }
    .question-card .label { font-size: 0.7rem; opacity: 0.7; margin-bottom: 6px; }
    .question-card .question { font-size: 1rem; font-weight: 600; line-height: 1.5; }
    /* 주차 선택 */
    .week-selector {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .week-selector button {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      color: var(--primary); display: flex; align-items: center; justify-content: center;
    }
    .week-selector .week-info { flex: 1; text-align: center; }
    .week-selector .week-num { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
    .week-selector .week-date { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
    /* 통계 */
    .stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat-box {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .stat-box .num { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .stat-box .lbl { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
    /* 현황 테이블 */
    .status-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .status-table th { color: var(--muted); font-weight: 600; font-size: 0.7rem; padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: center; }
    .status-table td { padding: 10px 6px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
    .status-table td:first-child { text-align: left; font-weight: 500; }
    .status-table tr:last-child td { border-bottom: none; }
    .badge-done { background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
    .badge-no { background: #f5f5f5; color: #bbb; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; }
    /* 인사이트 */
    .insight-section { margin-bottom: 14px; }
    .insight-section .title { font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: var(--primary-light); color: var(--primary); border-radius: 20px; padding: 4px 12px; font-size: 0.78rem; font-weight: 500; }
    .tag.accent { background: var(--accent-light); color: #8a6628; }
    .flow-text { font-size: 0.88rem; color: var(--text); font-weight: 500; line-height: 1.6; }
    .coaching-banner { background: var(--accent-light); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; font-size: 0.88rem; color: #7a5a1e; line-height: 1.6; }
    /* 멤버 배경 카드 */
    .member-bg-card {
      background: var(--primary-light); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 14px;
      font-size: 0.82rem;
    }
    .member-bg-card .bg-row { display: flex; gap: 6px; margin-bottom: 4px; align-items: flex-start; }
    .member-bg-card .bg-row:last-child { margin-bottom: 0; }
    .member-bg-card .bg-label { font-size: 0.68rem; font-weight: 700; color: var(--primary); min-width: 50px; padding-top: 1px; }
    .member-bg-card .bg-val { color: var(--text); line-height: 1.4; }
    /* 소스 배지 */
    .source-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .source-badge.ai { background: #e8f0fe; color: #1a56db; }
    .source-badge.keyword { background: #f0f0f0; color: #888; }
    /* 타임라인 */
    .timeline-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-date { font-size: 0.72rem; color: var(--muted); min-width: 36px; padding-top: 2px; }
    .timeline-text { font-size: 0.85rem; line-height: 1.5; color: var(--text); }
    /* 폼 */
    .form-label { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 5px; }
    .form-control, .form-select { border: 1px solid var(--border); border-radius: 10px; font-size: 0.88rem; padding: 10px 12px; background: var(--bg); }
    .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(107,124,94,0.12); }
    .btn-primary-custom { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 0.92rem; font-weight: 600; width: 100%; }
    .btn-primary-custom:disabled { opacity: 0.5; }
    /* 탭 */
    .inner-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
    .inner-tab { flex: 1; background: none; border: none; padding: 10px; font-size: 0.85rem; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .inner-tab.active { color: var(--primary); font-weight: 700; border-bottom: 2px solid var(--primary); }
    /* 전체흐름 테이블 */
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .admin-table th { background: var(--primary-light); color: var(--primary); padding: 8px 6px; font-weight: 600; font-size: 0.7rem; }
    .admin-table td { padding: 9px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .admin-table tr:last-child td { border-bottom: none; }
    /* 로딩 */
    .loading { text-align: center; padding: 32px; color: var(--muted); font-size: 0.88rem; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 잠금 화면 */
    .lock-screen { padding: 40px 20px; text-align: center; }
    .lock-screen i { font-size: 2.5rem; color: var(--primary); margin-bottom: 16px; }
    /* 토스트 */
    .toast-msg { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 999; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
    .toast-msg.show { opacity: 1; }
    /* 화면 */
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }
    /* 그룹 */
    .group-1 { background: #fde8e8; color: #c0392b; }
    .group-2 { background: #fef9e7; color: #b7770d; }
    .group-3 { background: #e8f4f8; color: #1a6fa8; }
    .group-4 { background: #e8f5e9; color: #2e7d32; }
    .group-5 { background: #f3e5f5; color: #6a1b9a; }
    /* 빈 상태 */
    .empty-state { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 0.85rem; }
    .empty-state i { font-size: 2rem; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
<div id="app-wrapper">

<!-- 상단 헤더 -->
<div class="app-header">
  <h1>🌱 자존주니</h1>
  <span class="week-chip" id="headerWeekChip"></span>
</div>

<!-- 홈 화면 -->
<div id="screen-home" class="screen active">
  <div class="question-card">
    <div class="label">오늘의 알아차림 질문</div>
    <div class="question" id="todayQuestion">불러오는 중...</div>
  </div>

  <div class="week-selector">
    <button onclick="changeWeek(-1)"><i class="bi bi-chevron-left"></i></button>
    <div class="week-info">
      <div class="week-num" id="weekNumLabel"></div>
      <div class="week-date" id="weekDateLabel"></div>
    </div>
    <button onclick="changeWeek(1)"><i class="bi bi-chevron-right"></i></button>
  </div>

  <div class="stats-row" id="statsArea">
    <div class="stat-box"><div class="num">-</div><div class="lbl">평균 인증 횟수</div></div>
    <div class="stat-box"><div class="num">-</div><div class="lbl">최고 인증 횟수</div></div>
    <div class="stat-box"><div class="num">-</div><div class="lbl">오늘 인증</div></div>
  </div>

  <div class="card" style="padding:14px;">
    <div class="card-label">멤버 현황</div>
    <div id="memberStatusArea"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>
</div>

<!-- 내 성장 화면 -->
<div id="screen-growth" class="screen">
  <div class="card">
    <div class="card-label">멤버 선택</div>
    <select class="form-select" id="growthMemberSelect" onchange="loadGrowthInsight()">
      <option value="">-- 멤버를 선택하세요 --</option>
    </select>
  </div>

  <div class="week-selector">
    <button onclick="changeWeek(-1)"><i class="bi bi-chevron-left"></i></button>
    <div class="week-info">
      <div class="week-num" id="growthWeekNumLabel"></div>
      <div class="week-date" id="growthWeekDateLabel"></div>
    </div>
    <button onclick="changeWeek(1)"><i class="bi bi-chevron-right"></i></button>
  </div>

  <div id="growthResult"></div>
</div>

<!-- 운영자 화면 -->
<div id="screen-admin" class="screen">
  <div id="adminLock">
    <div class="lock-screen">
      <i class="bi bi-lock-fill"></i>
      <div style="font-size:1rem;font-weight:600;margin-bottom:16px;">운영자 인증</div>
      <input type="password" class="form-control mb-3" id="adminPwInput" placeholder="비밀번호 입력" style="text-align:center;letter-spacing:4px;" />
      <button class="btn-primary-custom" onclick="doAdminLogin()">확인</button>
      <div id="adminPwError" style="color:var(--danger);font-size:0.8rem;margin-top:8px;"></div>
    </div>
  </div>

  <div id="adminDashboard" style="display:none;">
    <div class="inner-tabs">
      <button class="inner-tab active" id="tab-input" onclick="switchAdminTab('input')">📝 데이터 입력</button>
      <button class="inner-tab" id="tab-analysis" onclick="switchAdminTab('analysis')">📊 전체 흐름 분석</button>
    </div>

    <!-- 데이터 입력 탭 -->
    <div id="adminTabInput">
      <div class="card">
        <div class="mb-3">
          <label class="form-label">날짜</label>
          <input type="date" class="form-control" id="inputDate" />
        </div>
        <div class="mb-3">
          <label class="form-label">멤버</label>
          <select class="form-select" id="inputMember">
            <option value="">-- 멤버 선택 --</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">자기존중 기록 (데일리)</label>
          <textarea class="form-control" id="inputSelfRespect" rows="3" placeholder="오늘의 알아차림 내용을 입력하세요"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">주간 글쓰기 <span style="color:var(--muted);font-weight:400;">(선택)</span></label>
          <textarea class="form-control" id="inputWeeklyWriting" rows="3" placeholder="주간 글쓰기 내용을 입력하세요"></textarea>
        </div>
        <button class="btn-primary-custom" id="saveBtn" onclick="doSaveAuth()">저장하기</button>
        <div id="saveResult" style="text-align:center;margin-top:10px;font-size:0.85rem;"></div>
      </div>
    </div>

    <!-- 전체 흐름 분석 탭 -->
    <div id="adminTabAnalysis" style="display:none;">
      <div class="week-selector">
        <button onclick="changeWeek(-1)"><i class="bi bi-chevron-left"></i></button>
        <div class="week-info">
          <div class="week-num" id="adminWeekNumLabel"></div>
          <div class="week-date" id="adminWeekDateLabel"></div>
        </div>
        <button onclick="changeWeek(1)"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div class="card">
        <div class="card-label mb-2">전체 멤버 흐름 분석</div>
        <div id="adminAnalysisArea"><div class="loading"><div class="spinner"></div>분석 중...</div></div>
      </div>
    </div>
  </div>
</div>

<!-- 하단 탭바 -->
<nav class="bottom-nav">
  <button class="active" id="navHome" onclick="switchScreen('home')">
    <i class="bi bi-house-fill"></i>홈
  </button>
  <button id="navGrowth" onclick="switchScreen('growth')">
    <i class="bi bi-graph-up-arrow"></i>내 성장
  </button>
  <button id="navAdmin" onclick="switchScreen('admin')">
    <i class="bi bi-person-gear"></i>운영자
  </button>
</nav>

<div class="toast-msg" id="toastMsg"></div>
</div><!-- /app-wrapper -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
// =============================================
// ⚙️ GAS 웹앱 URL
// =============================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbwEUqvNyPW_ST9e4FadkuPDqh9f0DfMySeG_zeoLBomq4OoBuC7G7AtGRHS3M4_bcfU_w/exec";

// 1주차 시작일 (월요일 기준)
const FIRST_WEEK_MONDAY = new Date('2025-04-20');
FIRST_WEEK_MONDAY.setHours(0,0,0,0);

// =============================================
// 상태
// =============================================
let currentWeekMonday = getThisMonday();
let membersCache = [];
let adminLoggedIn = false;
let currentAdminTab = "input";

// =============================================
// GAS 통신
// =============================================
async function gasGet(params) {
  const url = GAS_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url, { method: "GET", redirect: "follow" });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error("응답 파싱 오류: " + text.slice(0, 100)); }
}

async function gasPost(body) {
  const res = await fetch(GAS_URL, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error("응답 파싱 오류: " + text.slice(0, 100)); }
}

// =============================================
// 날짜 / 주차 유틸
// =============================================
function getThisMonday() {
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function toDateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function getWeekNumber(monday) {
  const diff = monday - FIRST_WEEK_MONDAY;
  const n = Math.floor(diff / (7 * 24 * 60 * 60 * 1000)) + 1;
  return n > 0 ? n : 1;
}

function weekNumText(monday) {
  return getWeekNumber(monday) + "주차";
}

function weekDateText(monday) {
  const end = new Date(monday);
  end.setDate(monday.getDate() + 6);
  return (monday.getMonth()+1) + "/" + monday.getDate() + " ~ " + (end.getMonth()+1) + "/" + end.getDate();
}

function todayStr() {
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
  return toDateStr(now);
}

function changeWeek(dir) {
  currentWeekMonday = new Date(currentWeekMonday);
  currentWeekMonday.setDate(currentWeekMonday.getDate() + dir * 7);
  updateWeekUI();
  // 현재 활성 화면에 따라 리로드
  const active = document.querySelector('.screen.active').id;
  if (active === 'screen-home') loadHomeData();
  if (active === 'screen-growth' && document.getElementById('growthMemberSelect').value) loadGrowthInsight();
  if (active === 'screen-admin' && currentAdminTab === 'analysis') loadAdminAnalysis();
}

function updateWeekUI() {
  const num = weekNumText(currentWeekMonday);
  const date = weekDateText(currentWeekMonday);
  // 헤더
  document.getElementById("headerWeekChip").textContent = num;
  // 홈
  const wn = document.getElementById("weekNumLabel");
  const wd = document.getElementById("weekDateLabel");
  if (wn) wn.textContent = num;
  if (wd) wd.textContent = date;
  // 내 성장
  const gn = document.getElementById("growthWeekNumLabel");
  const gd = document.getElementById("growthWeekDateLabel");
  if (gn) gn.textContent = num;
  if (gd) gd.textContent = date;
  // 운영자
  const an = document.getElementById("adminWeekNumLabel");
  const ad = document.getElementById("adminWeekDateLabel");
  if (an) an.textContent = num;
  if (ad) ad.textContent = date;
}

// =============================================
// 화면 전환
// =============================================
function switchScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("nav" + name.charAt(0).toUpperCase() + name.slice(1)).classList.add("active");
  if (name === "growth") loadGrowthMemberList();
  if (name === "admin" && adminLoggedIn && currentAdminTab === "analysis") loadAdminAnalysis();
}

// =============================================
// 홈 화면
// =============================================
async function loadHomeData() {
  document.getElementById("memberStatusArea").innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';
  try {
    const [qRes, statusRes] = await Promise.all([
      gasGet({ action: "getTodayQuestion" }),
      gasGet({ action: "getFullStatus", week: toDateStr(currentWeekMonday) })
    ]);
    document.getElementById("todayQuestion").textContent = qRes.question || "질문을 불러올 수 없습니다.";
    renderStats(statusRes.stats);
    renderMemberTable(statusRes.list);
  } catch(e) {
    document.getElementById("memberStatusArea").innerHTML = '<div style="color:var(--danger);text-align:center;padding:20px;">데이터를 불러오지 못했습니다.<br><small>' + e.message + '</small></div>';
  }
}

function renderStats(stats) {
  if (!stats) return;
  document.getElementById("statsArea").innerHTML = `
    <div class="stat-box"><div class="num">${stats.avg}회</div><div class="lbl">평균 인증 횟수</div></div>
    <div class="stat-box"><div class="num">${stats.max}회</div><div class="lbl">최고 인증 횟수</div></div>
    <div class="stat-box"><div class="num">${stats.todayCount}명</div><div class="lbl">오늘 인증</div></div>
  `;
}

function renderMemberTable(list) {
  if (!list || list.length === 0) {
    document.getElementById("memberStatusArea").innerHTML = '<div class="empty-state"><i class="bi bi-people"></i>멤버 데이터가 없습니다.</div>';
    return;
  }
  const rows = list.map(m => `
    <tr>
      <td>${m.name}</td>
      <td>${m.count}회</td>
      <td>${m.writingDone ? '<span class="badge-done">완료</span>' : '<span class="badge-no">-</span>'}</td>
      <td>${m.today ? '<span class="badge-done">✓</span>' : '<span class="badge-no">-</span>'}</td>
    </tr>
  `).join("");
  document.getElementById("memberStatusArea").innerHTML = `
    <table class="status-table">
      <thead><tr><th>닉네임</th><th>인증</th><th>주간 글쓰기</th><th>오늘</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// =============================================
// 내 성장 화면
// =============================================
async function loadGrowthMemberList() {
  if (membersCache.length > 0) { fillMemberSelect("growthMemberSelect"); return; }
  try {
    membersCache = await gasGet({ action: "getMembers" });
    fillMemberSelect("growthMemberSelect");
  } catch(e) { showToast("멤버 목록을 불러오지 못했습니다."); }
}

function fillMemberSelect(selectId) {
  const sel = document.getElementById(selectId);
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- 멤버를 선택하세요 --</option>';
  membersCache.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id; opt.textContent = m.name;
    sel.appendChild(opt);
  });
  if (cur) sel.value = cur;
}

async function loadGrowthInsight() {
  const name = document.getElementById("growthMemberSelect").value;
  if (!name) { document.getElementById("growthResult").innerHTML = ""; return; }
  document.getElementById("growthResult").innerHTML = '<div class="loading"><div class="spinner"></div>분석 중...</div>';
  try {
    const data = await gasGet({ action: "getMemberInsight", name, week: toDateStr(currentWeekMonday) });
    renderInsight(data, "growthResult");
  } catch(e) {
    document.getElementById("growthResult").innerHTML = '<div style="color:var(--danger);padding:16px;">분석 중 오류가 발생했습니다.</div>';
  }
}

function groupClass(group) {
  if (!group) return "";
  if (group.startsWith("①")) return "group-1";
  if (group.startsWith("②")) return "group-2";
  if (group.startsWith("③")) return "group-3";
  if (group.startsWith("④")) return "group-4";
  if (group.startsWith("⑤")) return "group-5";
  return "";
}

function renderInsight(data, containerId) {
  if (!data) { document.getElementById(containerId).innerHTML = '<div class="loading">데이터가 없습니다.</div>'; return; }

  const sourceBadge = data.source === "ai"
    ? '<span class="source-badge ai"><i class="bi bi-stars"></i> AI 분석</span>'
    : data.source === "keyword"
    ? '<span class="source-badge keyword"><i class="bi bi-search"></i> 키워드 분석</span>'
    : '';

  // 멤버 배경 (신청이유, 현재상태, 목표)
  let bgHtml = "";
  if (data.background && (data.background.reason || data.background.status || data.background.goal)) {
    bgHtml = `<div class="member-bg-card">
      ${data.background.reason ? `<div class="bg-row"><span class="bg-label">신청 이유</span><span class="bg-val">${data.background.reason}</span></div>` : ""}
      ${data.background.status ? `<div class="bg-row"><span class="bg-label">현재 상태</span><span class="bg-val">${data.background.status}</span></div>` : ""}
      ${data.background.goal ? `<div class="bg-row"><span class="bg-label">바라는 모습</span><span class="bg-val">${data.background.goal}</span></div>` : ""}
    </div>`;
  }

  const statesHtml = (Array.isArray(data.states) ? data.states : [data.states]).map(s => `<span class="tag">${s}</span>`).join("");
  const stopsHtml = (Array.isArray(data.stops) ? data.stops : [data.stops]).map(s => `<span class="tag">${s}</span>`).join("");
  const patternsHtml = Array.isArray(data.patterns)
    ? data.patterns.map(p => `<span class="tag accent">${p}</span>`).join("")
    : `<span class="tag accent">${data.patterns || "-"}</span>`;

  const timelineHtml = (data.timeline || []).map(t => `
    <div class="timeline-item">
      <div class="timeline-date">${t.date}</div>
      <div class="timeline-text">${t.text}</div>
    </div>
  `).join("") || '<div class="empty-state"><i class="bi bi-journal"></i>기록이 없습니다.</div>';

  const coachingHtml = data.coaching
    ? `<div class="coaching-banner mt-3"><i class="bi bi-chat-heart" style="margin-right:6px;"></i>${data.coaching}</div>`
    : "";

  document.getElementById(containerId).innerHTML = `
    <div class="card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div style="font-weight:700;font-size:1rem;">${data.name}</div>
        ${sourceBadge}
      </div>
      ${data.group ? `<div class="mb-3"><span class="tag ${groupClass(data.group)}" style="border-radius:8px;padding:4px 12px;">${data.group}</span></div>` : ""}

      ${bgHtml}

      <div class="insight-section">
        <div class="title">🪞 자주 느낀 상태</div>
        <div class="tag-row">${statesHtml}</div>
      </div>
      <div class="insight-section">
        <div class="title">⏸ 멈춘 순간</div>
        <div class="tag-row">${stopsHtml}</div>
      </div>
      <div class="insight-section">
        <div class="title">🔁 알아차린 패턴</div>
        <div class="tag-row">${patternsHtml}</div>
      </div>
      <div class="insight-section">
        <div class="title">🌊 이번 주 흐름</div>
        <div class="flow-text">${data.flow || "-"}</div>
      </div>
      ${coachingHtml}
    </div>

    <div class="card" style="padding:14px;">
      <div class="card-label">기록 타임라인</div>
      ${timelineHtml}
    </div>
  `;
}

// =============================================
// 운영자 화면
// =============================================
async function doAdminLogin() {
  const pw = document.getElementById("adminPwInput").value;
  try {
    const res = await gasPost({ action: "verifyAdmin", password: pw });
    if (res.ok) {
      adminLoggedIn = true;
      document.getElementById("adminLock").style.display = "none";
      document.getElementById("adminDashboard").style.display = "block";
      await loadAdminMemberList();
      document.getElementById("inputDate").value = todayStr();
    } else {
      document.getElementById("adminPwError").textContent = "비밀번호가 올바르지 않습니다.";
    }
  } catch(e) {
    document.getElementById("adminPwError").textContent = "오류: " + e.message;
  }
}

async function loadAdminMemberList() {
  if (membersCache.length === 0) membersCache = await gasGet({ action: "getMembers" });
  const sel = document.getElementById("inputMember");
  sel.innerHTML = '<option value="">-- 멤버 선택 --</option>';
  membersCache.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id; opt.textContent = m.name;
    sel.appendChild(opt);
  });
}

async function doSaveAuth() {
  const formData = {
    date: document.getElementById("inputDate").value,
    memberId: document.getElementById("inputMember").value,
    selfRespect: document.getElementById("inputSelfRespect").value,
    weeklyWriting: document.getElementById("inputWeeklyWriting").value
  };
  const btn = document.getElementById("saveBtn");
  const result = document.getElementById("saveResult");
  btn.disabled = true; btn.textContent = "저장 중...";
  try {
    const res = await gasPost({ action: "saveAuth", formData });
    result.textContent = res.message;
    result.style.color = res.message.startsWith("✅") ? "var(--success)" : "var(--danger)";
    if (res.message.startsWith("✅")) {
      document.getElementById("inputSelfRespect").value = "";
      document.getElementById("inputWeeklyWriting").value = "";
      document.getElementById("inputMember").value = "";
    }
  } catch(e) {
    result.textContent = "❌ 저장 실패: " + e.message;
    result.style.color = "var(--danger)";
  } finally {
    btn.disabled = false; btn.textContent = "저장하기";
  }
}

function switchAdminTab(tab) {
  currentAdminTab = tab;
  document.getElementById("tab-input").classList.toggle("active", tab === "input");
  document.getElementById("tab-analysis").classList.toggle("active", tab === "analysis");
  document.getElementById("adminTabInput").style.display = tab === "input" ? "block" : "none";
  document.getElementById("adminTabAnalysis").style.display = tab === "analysis" ? "block" : "none";
  if (tab === "analysis") loadAdminAnalysis();
}

async function loadAdminAnalysis() {
  document.getElementById("adminAnalysisArea").innerHTML = '<div class="loading"><div class="spinner"></div>전체 분석 중...<br><small>AI 분석 시 시간이 걸릴 수 있습니다</small></div>';
  try {
    const data = await gasGet({ action: "getAllAdminAnalysis", week: toDateStr(currentWeekMonday) });
    renderAdminAnalysis(data);
  } catch(e) {
    document.getElementById("adminAnalysisArea").innerHTML = '<div style="color:var(--danger);padding:16px;">분석 실패: ' + e.message + '</div>';
  }
}

function renderAdminAnalysis(dataArr) {
  if (!dataArr || dataArr.length === 0) {
    document.getElementById("adminAnalysisArea").innerHTML = '<div class="empty-state"><i class="bi bi-people"></i>데이터가 없습니다.</div>';
    return;
  }
  const rows = dataArr.map(d => {
    const states = Array.isArray(d.states) ? d.states.filter(s => s !== "기록 없음").join(", ") || "-" : (d.states || "-");
    const gc = groupClass(d.group);
    const src = d.source === "ai"
      ? '<span class="source-badge ai" style="font-size:0.6rem;">AI</span>'
      : '<span class="source-badge keyword" style="font-size:0.6rem;">KW</span>';
    return `
      <tr>
        <td style="font-weight:600;">${d.name} ${src}</td>
        <td>${d.group ? `<span class="tag ${gc}" style="font-size:0.68rem;padding:2px 7px;border-radius:6px;">${d.group}</span>` : "-"}</td>
        <td style="max-width:100px;font-size:0.75rem;">${states}</td>
        <td style="max-width:90px;font-size:0.72rem;color:var(--muted);">${d.flow || "-"}</td>
      </tr>
    `;
  }).join("");
  document.getElementById("adminAnalysisArea").innerHTML = `
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead><tr><th>멤버</th><th>그룹</th><th>상태</th><th>흐름</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// =============================================
// 토스트
// =============================================
function showToast(msg) {
  const el = document.getElementById("toastMsg");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

// =============================================
// 초기화
// =============================================
(async function init() {
  updateWeekUI();
  await loadHomeData();
})();
</script>
</body>
</html>
